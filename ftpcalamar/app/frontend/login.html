<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTP Calamar - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="login-body">

    <main class="login-container">
        <h1>FTP CALAMAR</h1>

        <form id="loginForm">
            <input
                id="username"
                type="text"
                placeholder="Usuario"
                required>

            <input
                id="password"
                type="password"
                placeholder="Contraseña"
                required>

            <button type="submit">
                Ingresar
            </button>
        </form>
    </main>

    <script src="/js/login.js"></script>

</body>

</html>
